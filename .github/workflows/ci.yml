name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - name: Validate workspace build artifacts
        run: |
          uv build --package indoscraping-core
          uv build --package blibli-scraper
          uv build --package tokopedia-scraper
          uv build --package alfagift-scraper
          uv build --package indomaret-scraper
