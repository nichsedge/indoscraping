[project]
name = "alfagift-scraper"
version = "0.1.0"
description = "Standalone Alfamart Alfagift e-commerce catalog & product scraper for Python."
readme = "README.md"
requires-python = ">=3.14.7"
keywords = ["alfagift", "alfagift-scraper", "alfamart", "ecommerce-scraper", "indonesia", "indoscraping", "scraping"]
dependencies = [
    "indoscraping-core",
    "curl-cffi>=0.16.2",
]

[project.scripts]
alfagift-scraper = "alfagift_scraper.cli:main"

[project.entry-points."indoscraping.scrapers"]
alfagift = "alfagift_scraper.cli:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.12.8"]
build-backend = "uv_build"
