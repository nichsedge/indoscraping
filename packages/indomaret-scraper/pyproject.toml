[project]
name = "indomaret-scraper"
version = "0.1.0"
description = "Standalone Klik Indomaret e-commerce catalog & inventory scraper for Python."
readme = "README.md"
requires-python = ">=3.12"
keywords = ["indomaret", "indomaret-scraper", "klikindomaret", "ecommerce-scraper", "indonesia", "indoscraping", "scraping"]
dependencies = [
    "indoscraping-core",
    "curl-cffi>=0.15.0",
]

[project.scripts]
indomaret-scraper = "indomaret_scraper.cli:main"

[project.entry-points."indoscraping.scrapers"]
indomaret = "indomaret_scraper.cli:main"

[build-system]
requires = ["uv_build>=0.8.2,<0.9.0"]
build-backend = "uv_build"
