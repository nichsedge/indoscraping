[project]
name = "indoscraping-core"
version = "0.1.0"
description = "Core engine, anti-bot utilities, data quality, and schemas for IndoScraping."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "curl-cffi>=0.15.0",
    "fake-useragent>=2.2.0",
    "httpx[http2]>=0.28.1",
    "pandas>=3.0.2",
    "pydantic>=2.13.3",
    "rich>=15.0.0",
]

[build-system]
requires = ["uv_build>=0.8.2,<0.9.0"]
build-backend = "uv_build"
