[project]
name = "tokopedia-scraper"
version = "0.1.0"
description = "Standalone Tokopedia catalog & product search scraper for Python."
readme = "README.md"
requires-python = ">=3.12"
keywords = ["tokopedia", "tokopedia-scraper", "ecommerce-scraper", "indonesia", "indoscraping", "scraping", "tokopedia-com"]
dependencies = [
    "indoscraping-core",
    "setuptools",
    "beautifulsoup4>=4.13.4",
    "pandas>=3.0.2",
    "selenium>=4.43.0",
    "undetected-chromedriver>=3.5.5",
]

[project.scripts]
tokopedia-scraper = "tokopedia_scraper.cli:main"

[project.entry-points."indoscraping.scrapers"]
tokopedia = "tokopedia_scraper.cli:main"

[build-system]
requires = ["uv_build>=0.8.2,<0.9.0"]
build-backend = "uv_build"
