[project]
name = "indoscraping"
version = "0.1.0"
description = "Unified web scraper suite & visual CLI dashboard for Indonesian news, e-commerce (Tokopedia, Blibli, Alfagift, Klik Indomaret), and digital banks."
readme = "README.md"
requires-python = ">=3.14.7"
keywords = [
    "indoscraping",
    "blibli",
    "blibli-scraper",
    "tokopedia",
    "tokopedia-scraper",
    "idx-bei",
    "detik",
    "bisnis",
    "cnbc",
    "cnn",
    "kompas",
    "narasi",
    "alfagift",
    "indomaret",
    "web-scraping",
    "indonesia",
    "indonesia-scraper",
]
dependencies = [
    "indoscraping-core",
    "blibli-scraper",
    "tokopedia-scraper",
    "alfagift-scraper",
    "indomaret-scraper",
    "setuptools",
    "beautifulsoup4>=4.15.0",
    "curl-cffi>=0.16.2",
    "fake-useragent>=2.2.0",
    "httpx[http2]>=0.28.1",
    "pandas>=3.0.5",
    "pendulum>=3.2.0",
    "playwright>=1.62.0",
    "playwright-stealth>=2.0.3",
    "pydantic>=2.13.5",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "pytest>=9.1.1",
    "pillow>=12.3.0",
    "pyarrow>=25.0.1",
]

[project.optional-dependencies]
ocr = [
    "rapidocr-onnxruntime>=1.4.4",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[project.scripts]
indoscraping = "indoscraping:main"

[tool.uv]
managed = true

[tool.uv.workspace]
members = [
    "packages/*",
]

[tool.uv.sources]
indoscraping-core = { workspace = true }
blibli-scraper = { workspace = true }
tokopedia-scraper = { workspace = true }
alfagift-scraper = { workspace = true }
indomaret-scraper = { workspace = true }

[build-system]
requires = ["uv_build>=0.12.7,<0.12.8"]
build-backend = "uv_build"

